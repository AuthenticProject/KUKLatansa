<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Catat Tip Potong Kaca — KUK Bangunan</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#540000">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="shared/mobile.css">
  <style>
    :root {
      --primary: #540000;
      --primary-hover: #3d0000;
      --secondary: #FFCC00;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 20px 80px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .app-container { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 20px; }
    .header { text-align: center; }
    .header h1 { font-size: 26px; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
    .header p { font-size: 14px; color: var(--text-muted); }
    .unit-tag { display: inline-flex; align-items: center; gap: 6px; background: #fef3c7; color: #b45309; font-size: 12px; font-weight: 800; padding: 4px 12px; border-radius: 999px; margin-bottom: 8px; border: 1px solid #fde68a; }
    .card { background: var(--surface); padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    input[type="number"], input[type="date"], input[type="text"], select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; font-family: inherit; }
    input:focus, select:focus { border-color: var(--primary); background: #ffffff; }
    input[readonly] { background: #f1f5f9; color: var(--text-muted); font-weight: 700; cursor: not-allowed; }
    .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 8px; }
    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .back-link { text-align: center; margin-top: 10px; }
    .back-link a { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
    .back-link a:hover { color: var(--primary); }
    .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 300; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: white; color: var(--text); padding: 14px 24px; border-radius: 100px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); font-weight: 600; font-size: 14px; border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 10px; animation: toastIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; }
    .toast.success { border-left-color: var(--success); }
    @keyframes toastIn { 0% { transform: translateY(-100%); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <div class="app-container">
    <div class="header">
      <div class="unit-tag">🏗️ Modul Khusus: KUK Bangunan (Potong Kaca)</div>
      <h1>Catat Tip Potong Kaca 3%</h1>
      <p>Kalkulasi komisi tip potong kaca untuk karyawan KUK Bangunan secara otomatis.</p>
    </div>
    
    <div class="card">
      <div class="form-group">
        <label>Pilih Karyawan (KUK Bangunan)</label>
        <select id="tkKaryawan">
          <option value="" disabled selected>Memuat daftar karyawan Bangunan...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Jenis Kaca</label>
        <select id="tkJenis" onchange="hitungTip()">
          <option value="" disabled selected>Pilih jenis kaca...</option>
          <option value="11" data-name="Kaca Air 2mm">Kaca Air 2mm - Rp 11/m²</option>
          <option value="13" data-name="Kaca Air 3mm">Kaca Air 3mm - Rp 13/m²</option>
          <option value="16" data-name="Kaca Air 5mm">Kaca Air 5mm - Rp 16/m²</option>
          <option value="16" data-name="Kaca Cermin 2mm">Kaca Cermin 2mm - Rp 16/m²</option>
          <option value="20" data-name="Kaca Cermin 3mm">Kaca Cermin 3mm - Rp 20/m²</option>
          <option value="11" data-name="Kaca Es 3mm">Kaca Es 3mm - Rp 11/m²</option>
          <option value="20" data-name="Kaca Es 5mm">Kaca Es 5mm - Rp 20/m²</option>
          <option value="18" data-name="Kaca Riben 5mm">Kaca Riben 5mm - Rp 18/m²</option>
        </select>
      </div>

      <div class="form-group">
        <label>Luas Kaca (m²)</label>
        <input type="number" id="tkLuas" placeholder="Contoh: 1.5" step="0.01" min="0" oninput="hitungTip()">
      </div>

      <div class="form-group">
        <label>Total Harga Kaca</label>
        <input type="text" id="tkTotalHarga" readonly value="Rp 0">
      </div>

      <div class="form-group">
        <label>Tip Karyawan (3%)</label>
        <input type="text" id="tkTip" readonly value="Rp 0" style="color:var(--primary); font-weight:800; font-size:16px;">
      </div>

      <div class="form-group">
        <label>Tanggal Pemotongan</label>
        <input type="date" id="tkWaktu">
      </div>

      <button class="btn-submit" id="submitBtn" onclick="simpanTip()">💾 Simpan Data Tip Kaca</button>
    </div>

    <div class="back-link">
      <a href="index.html">← Kembali ke Portal</a>
    </div>
  </div>

  <script src="shared/master_db.js?v=1787281369"></script>
  <script src="shared/security.js?v=1787281369"></script>
  <script src="shared/shell.js?v=1787281369" data-base="."></script>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAjktMA76CUG0l-kCOMuazdLrWt6ULfv6cwhlL-QuGiwhtVJx8Sb12tkOHyXqk48tl/exec";

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = type === 'success' ? `✓ ${msg}` : `! ${msg}`;
      container.appendChild(t);
      setTimeout(() => { t.style.animation = 'toastOut 0.3s forwards'; setTimeout(() => t.remove(), 300); }, 3500);
    }

    document.addEventListener('DOMContentLoaded', () => {
      MasterDB.init();

      // Set default date
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      const localDate = new Date(now - offset).toISOString().split('T')[0];
      document.getElementById('tkWaktu').value = localDate;

      populateEmployees();
    });

    function populateEmployees() {
      const sel = document.getElementById('tkKaryawan');
      sel.innerHTML = '<option value="" disabled selected>Pilih Karyawan Bangunan...</option>';

      // Filter specifically KUK Bangunan employees
      const emps = MasterDB.getEmployees().filter(e => {
        const isAct = e.status === 'Active' || e.status === 'Aktif';
        const isB = !e.unit || e.unit.toLowerCase().includes('bangunan');
        return isAct && isB;
      });

      emps.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.fullName;
        opt.textContent = `${e.fullName} (${e.department || 'Operasional'})`;
        sel.appendChild(opt);
      });
    }

    function hitungTip() {
      const jenisSelect = document.getElementById('tkJenis');
      const luasInput = document.getElementById('tkLuas');
      
      const hargaPerMeter = parseFloat(jenisSelect.value) || 0;
      const luas = parseFloat(luasInput.value) || 0;
      
      // Rumus: Total = luas * hargaPerMeter * 1000 (jika skala ribuan) atau harga riil
      const totalHarga = luas * hargaPerMeter * 1000;
      const tip = Math.round(totalHarga * 0.03);
      
      document.getElementById('tkTotalHarga').value = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalHarga);
      document.getElementById('tkTip').value = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(tip);
    }

    async function simpanTip() {
      const karyawan = document.getElementById('tkKaryawan').value;
      const jenisSelect = document.getElementById('tkJenis');
      const jenis = jenisSelect.options[jenisSelect.selectedIndex] ? jenisSelect.options[jenisSelect.selectedIndex].getAttribute('data-name') : '';
      const luas = parseFloat(document.getElementById('tkLuas').value);
      const waktu = document.getElementById('tkWaktu').value;

      if (!karyawan) return showToast('Pilih karyawan terlebih dahulu', 'error');
      if (!jenis) return showToast('Pilih jenis kaca', 'error');
      if (isNaN(luas) || luas <= 0) return showToast('Masukkan luas kaca yang valid', 'error');
      if (!waktu) return showToast('Pilih tanggal pemotongan', 'error');

      const hargaPerMeter = parseFloat(jenisSelect.value) || 0;
      const totalHarga = luas * hargaPerMeter * 1000;
      const tip = Math.round(totalHarga * 0.03);

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      // Save to local storage kuk_db_tip_v1
      try {
        const localTips = JSON.parse(localStorage.getItem('kuk_db_tip_v1') || '[]');
        localTips.push({
          id: 'TIP-' + Date.now(),
          namaKaryawan: karyawan,
          jenisKaca: jenis,
          luas: luas,
          totalHarga: totalHarga,
          nominalTip: tip,
          tanggal: waktu,
          unit: 'KUK Bangunan',
          timestamp: new Date().toISOString()
        });
        localStorage.setItem('kuk_db_tip_v1', JSON.stringify(localTips));
      } catch (e) {}

      // Cloud sync
      try {
        const payload = {
          action: 'submit_tip',
          karyawan: karyawan,
          jenis: jenis,
          luas: luas,
          totalHarga: totalHarga,
          tip: tip,
          waktu: waktu
        };

        const OLD_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzlX0afsHljDmZaq5NecfO4ofaXSRHX2_4r8ClPeo8NjVESWLaYNpjpXEk1VKF230S/exec";
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(()=>{});

        fetch(OLD_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(()=>{});

        showToast('Data tip potong kaca berhasil disimpan!', 'success');
        document.getElementById('tkLuas').value = '';
        document.getElementById('tkTotalHarga').value = 'Rp 0';
        document.getElementById('tkTip').value = 'Rp 0';
      } catch (err) {
        showToast('Tersimpan di sistem lokal: ' + err.message, 'info');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 Simpan Data Tip Kaca';
      }
    }
  </script>
</body>
</html>
