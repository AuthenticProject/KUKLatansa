<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Manajemen Pengguna - KUK HR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#540000">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" href="favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="stylesheet" href="shared/shell.css">
  <style>
    /* Styling according to new Maroon/Gold Phase 1 tokens */
    body { 
      background-color: var(--kuk-bg); 
      color: var(--kuk-text); 
      padding: 40px 20px 100px; 
      min-height: 100vh; 
      font-family: var(--kuk-font);
    }
    .app-container { width: 100%; max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .header { text-align: center; margin-bottom: 10px; }
    .header h1 { font-size: 28px; font-weight: 700; color: var(--kuk-primary); letter-spacing: -0.5px; }
    .header p { font-size: 15px; color: var(--kuk-text-muted); margin-top: 8px; }
    
    .card { background: var(--kuk-surface); border-radius: var(--kuk-radius); box-shadow: var(--kuk-shadow); padding: 24px; border: 1px solid var(--kuk-border); }
    
    .btn { padding: 10px 16px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--kuk-primary); color: white; }
    .btn-primary:hover { background: #6b0000; transform: translateY(-1px); }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--kuk-danger); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    
    .user-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #fdfdfd; border: 1px solid var(--kuk-border); border-radius: 12px; }
    .user-info h3 { font-size: 16px; margin-bottom: 4px; color: var(--kuk-primary); }
    .user-info p { font-size: 13px; color: var(--kuk-text-muted); }
    
    .actions { display: flex; gap: 8px; }
    
    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--kuk-surface); width: 100%; max-width: 450px; border-radius: var(--kuk-radius); padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: modalIn 0.3s ease; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 16px; font-size: 20px; color: var(--kuk-primary); }
    @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--kuk-text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input[type="text"], .form-group input[type="password"], .form-group select { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--kuk-border); font-size: 15px; font-weight: 500; outline: none; background: #f8fafc; color: var(--kuk-text); font-family: var(--kuk-font); }
    .form-group input:focus, .form-group select:focus { border-color: var(--kuk-primary); background: var(--kuk-surface); box-shadow: 0 0 0 3px rgba(84, 0, 0, 0.1); }
    
    .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .perm-item { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
    
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>Manajemen Staff & Akses</h1>
      <p>Kelola akses login untuk karyawan KUK</p>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="font-size:18px; color:var(--kuk-primary);">Daftar Pengguna</h2>
        <button class="btn btn-primary" onclick="openModal()">+ Tambah Akun</button>
      </div>
      <div class="user-list" id="userList">
        <!-- List users -->
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="userModal">
    <div class="modal">
      <h2 id="modalTitle">Tambah Akun</h2>
      
      <div class="form-group">
        <label>Hubungkan ke Karyawan</label>
        <select id="employeeSelect">
          <!-- Populated by JS -->
        </select>
        <small style="color:var(--kuk-danger); font-size:11px; display:block; margin-top:4px;">*User harus terhubung dengan data Master Karyawan.</small>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input type="text" id="usernameInput" placeholder="Masukkan username">
      </div>
      <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" id="passwordInput" placeholder="Minimal 5 karakter">
      </div>
      
      <div class="form-group">
        <label>Akses Menu (Permissions)</label>
        <div class="perm-grid" id="permContainer">
          <label class="perm-item"><input type="checkbox" value="absen"> Rekap Absen</label>
          <label class="perm-item"><input type="checkbox" value="cuti"> Cuti</label>
          <label class="perm-item"><input type="checkbox" value="pelanggaran"> Pelanggaran</label>
          <label class="perm-item"><input type="checkbox" value="dashboard"> Dashboard</label>
          <label class="perm-item"><input type="checkbox" value="tip"> Tip Kaca</label>
          <label class="perm-item"><input type="checkbox" value="karyawan"> Data Karyawan</label>
          <label class="perm-item"><input type="checkbox" value="peminjaman"> Kendaraan</label>
          <label class="perm-item"><input type="checkbox" value="users"> User Admin</label>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn" style="background: var(--kuk-surface); border: 1px solid var(--kuk-border);" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveUser()">Simpan Akun</button>
      </div>
    </div>
  </div>

  <script src="shared/master_db.js"></script>
  <script src="shared/shell.js" data-base="."></script>
  <script>
    let editingUserId = null;

    function renderUsers() {
      const list = document.getElementById('userList');
      list.innerHTML = '';
      
      const users = MasterDB.getUsersWithEmployee();
      
      if (users.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--kuk-text-muted);">Belum ada pengguna.</div>';
        return;
      }

      users.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        
        const permsText = u.permissions && u.permissions.length > 0 
          ? u.permissions.join(', ') 
          : 'Tidak ada akses khusus';
          
        const empName = u.employee ? u.employee.fullName : '<span style="color:var(--kuk-danger)">[Tidak Terhubung]</span>';
        const empPos = u.employee ? u.employee.position : '';
        
        div.innerHTML = `
          <div class="user-info">
            <h3>${u.username}</h3>
            <p style="color:var(--kuk-accent); font-weight:600; margin-top:2px;">Karyawan: ${empName} ${empPos ? `(${empPos})` : ''}</p>
            <p style="margin-top:2px;">Akses: ${permsText}</p>
          </div>
          <div class="actions">
            <button class="btn" style="background: var(--kuk-bg); border: 1px solid var(--kuk-border);" onclick="editUser('${u.id}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteUser('${u.id}')">Hapus</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function populateEmployeeSelect() {
      const select = document.getElementById('employeeSelect');
      select.innerHTML = '<option value="">-- Pilih Karyawan --</option>';
      const emps = MasterDB.getEmployees();
      emps.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.id;
        opt.textContent = `${e.fullName} (${e.unit} - ${e.position})`;
        select.appendChild(opt);
      });
    }

    function openModal() {
      editingUserId = null;
      document.getElementById('modalTitle').textContent = 'Tambah Akun';
      document.getElementById('usernameInput').value = '';
      document.getElementById('passwordInput').value = '';
      populateEmployeeSelect();
      document.getElementById('employeeSelect').value = '';
      document.querySelectorAll('#permContainer input[type="checkbox"]').forEach(cb => cb.checked = false);
      
      document.getElementById('userModal').classList.add('show');
    }

    function editUser(id) {
      editingUserId = id;
      document.getElementById('modalTitle').textContent = 'Edit Akun';
      
      const u = MasterDB.getUser(id);
      if(!u) return;

      document.getElementById('usernameInput').value = u.username;
      document.getElementById('passwordInput').value = u.password;
      populateEmployeeSelect();
      document.getElementById('employeeSelect').value = u.employeeId;
      
      document.querySelectorAll('#permContainer input[type="checkbox"]').forEach(cb => {
        cb.checked = u.permissions ? u.permissions.includes(cb.value) : false;
      });
      
      document.getElementById('userModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('userModal').classList.remove('show');
    }

    function saveUser() {
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const employeeId = document.getElementById('employeeSelect').value;
      
      if (!username || !password || !employeeId) {
        alert('Username, Kata Sandi, dan Karyawan wajib diisi!');
        return;
      }
      
      const checkboxes = document.querySelectorAll('#permContainer input[type="checkbox"]:checked');
      const permissions = Array.from(checkboxes).map(cb => cb.value);
      
      const allUsers = MasterDB.getUsers();
      
      if (!editingUserId) {
        // Create new
        if (allUsers.some(u => u.username === username)) {
          alert('Username sudah ada!');
          return;
        }
        MasterDB.saveUser({ username, password, employeeId, permissions });
      } else {
        // Edit existing
        const existing = allUsers.find(u => u.username === username);
        if (existing && existing.id !== editingUserId) {
          alert('Username sudah digunakan!');
          return;
        }
        const currentUser = MasterDB.getUser(editingUserId);
        MasterDB.saveUser({ ...currentUser, username, password, employeeId, permissions });
      }
      
      renderUsers();
      closeModal();
    }

    function deleteUser(id) {
      if (confirm('Yakin ingin menghapus pengguna ini?')) {
        MasterDB.deleteUser(id);
        renderUsers();
      }
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      renderUsers();
    });
  </script>
</body>
</html>
