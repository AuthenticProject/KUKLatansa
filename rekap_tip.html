<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rekapan Tip Pemotongan Kaca (3%) — KUK La Tansa</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#540000">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="shortcut icon" href="favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/design-tokens.css">
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="shared/mobile.css">
  <style>
    body.kuk-has-shell {
      padding-top: 80px !important;
      background-color: var(--kuk-bg, #f8fafc);
      color: var(--kuk-text, #0f172a);
      font-family: var(--kuk-font, 'Outfit', sans-serif);
      min-height: 100vh;
    }
    .page-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .page-header {
      background: var(--kuk-surface, #ffffff);
      border-radius: var(--kuk-radius-lg, 20px);
      padding: 22px 28px;
      border: 1px solid var(--kuk-border, #e2e8f0);
      box-shadow: var(--kuk-shadow-sm, 0 2px 8px rgba(0,0,0,0.04));
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title-group h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--kuk-primary, #540000);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title-group p {
      font-size: 13.5px;
      color: var(--kuk-text-muted, #64748b);
    }

    /* Summary Chips per Karyawan */
    .emp-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .emp-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .emp-card.highlight {
      background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
      border: 1.5px solid #f59e0b;
    }
    .emp-card-label {
      font-size: 11.5px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .emp-card-val {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }
    .emp-card.highlight .emp-card-val {
      color: #b45309;
    }

    .panel {
      background: var(--kuk-surface, #ffffff);
      border-radius: var(--kuk-radius-lg, 20px);
      padding: 24px;
      border: 1px solid var(--kuk-border, #e2e8f0);
      box-shadow: var(--kuk-shadow-sm, 0 2px 8px rgba(0,0,0,0.04));
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, input[type="month"] {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--kuk-border, #cbd5e1);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      background: #ffffff;
      color: var(--kuk-text, #0f172a);
      outline: none;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--kuk-primary, #540000); color: white; }
    .btn-primary:hover { background: #730000; }
    .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .btn-secondary:hover { background: #e2e8f0; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    th {
      background: #f8fafc;
      padding: 14px 16px;
      text-align: left;
      font-weight: 700;
      color: #475569;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 2px solid #e2e8f0;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: #1e293b;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    .badge-tip {
      background: #dcfce7;
      color: #15803d;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .btn-del {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fca5a5;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-del:hover { background: #fca5a5; color: #7f1d1d; }
  </style>
</head>
<body class="kuk-has-shell">

  <div class="page-container">
    
    <!-- Page Header -->
    <header class="page-header">
      <div class="page-title-group">
        <h1>🪟 Rekapan Tip Pemotongan Kaca (3%)</h1>
        <p>Alokasi tip 3% dari hasil pemotongan kaca harian toko KUK Bangunan</p>
      </div>
      <div style="display:flex; gap:10px;">
        <button onclick="syncDataCloud()" class="btn btn-secondary">🔄 Refresh / Sinkron</button>
        <a href="tip.html" class="btn btn-primary">➕ Input Tip Baru</a>
      </div>
    </header>

    <!-- Ringkasan Per Karyawan -->
    <div class="emp-summary-grid" id="empSummaryGrid">
      <!-- Generated via JS -->
    </div>

    <!-- Main Panel Table -->
    <main class="panel">
      
      <div class="filter-bar">
        <div class="filter-group">
          <label style="font-weight:700; font-size:13px; color:#475569;">🔍 Filter & Rekapan Tip Kaca:</label>
          <input type="month" id="filterMonth" onchange="loadRekapTip()">
          <select id="filterKaryawan" onchange="loadRekapTip()">
            <option value="ALL">Semua Karyawan</option>
          </select>
        </div>
        <div>
          <button class="btn btn-secondary" onclick="exportToExcel()">📊 Ekspor Excel</button>
        </div>
      </div>

      <!-- Mobile Cards for Tip Entries -->
      <div id="tipMobileCards" class="show-mobile" style="display:none; flex-direction:column; gap:10px; margin-bottom:14px;">
        <!-- Rendered by JS -->
      </div>

      <div class="table-wrapper hide-mobile">
        <table>
          <thead>
            <tr>
              <th style="width: 110px;">Tanggal</th>
              <th>Nama Karyawan</th>
              <th>Jenis Kaca</th>
              <th>Luas (m²)</th>
              <th>Total Harga</th>
              <th>Tip (3%)</th>
              <th style="width: 60px; text-align:center;">Aksi</th>
            </tr>
          </thead>
          <tbody id="rekapTipTableBody">
            <tr>
              <td colspan="7" style="text-align:center; padding:40px; color:#94a3b8;">
                Memuat data rekapan tip kaca...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>

  </div>

  <script src="shared/master_db.js"></script>
  <script src="shared/security.js"></script>
  <script src="shared/shell.js" data-base="."></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const monthStr = now.toISOString().slice(0, 7);
      const mInput = document.getElementById('filterMonth');
      if (mInput) mInput.value = monthStr;
      
      populateKaryawanDropdown();
      loadRekapTip();

      // Real-time background sync from old & new Google Sheets DB every 10s
      setInterval(() => {
        syncDataCloud(true);
      }, 10000);
    });

    function getTipData() {
      try {
        if (typeof MasterDB !== 'undefined' && MasterDB.getTipData) {
          const list = MasterDB.getTipData();
          if (Array.isArray(list) && list.length > 0) return list;
        }
        const raw1 = localStorage.getItem('kuk_db_tip_v1');
        if (raw1) { const parsed = JSON.parse(raw1); if (Array.isArray(parsed) && parsed.length > 0) return parsed; }
        const raw2 = localStorage.getItem('kuk_tip_db_v1');
        if (raw2) { const parsed = JSON.parse(raw2); if (Array.isArray(parsed) && parsed.length > 0) return parsed; }
        return (typeof MasterDB !== 'undefined' && MasterDB.DEFAULT_TIP_DATA) ? MasterDB.DEFAULT_TIP_DATA : [];
      } catch(e) {
        return (typeof MasterDB !== 'undefined' && MasterDB.DEFAULT_TIP_DATA) ? MasterDB.DEFAULT_TIP_DATA : [];
      }
    }

    function formatRp(val) {
      const num = Number(val || 0);
      return 'Rp ' + num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function getEmpName(t) {
      if (!t) return '-';
      const n = t.namaKaryawan || t.karyawan || t.nama || t.name || t.employee || t.empName || '';
      return n && n !== '-' ? n : '-';
    }

    function populateKaryawanDropdown() {
      const sel = document.getElementById('filterKaryawan');
      if (!sel) return;
      const allTips = getTipData();
      const namesSet = new Set();
      allTips.forEach(t => {
        const n = getEmpName(t);
        if (n && n !== '-') namesSet.add(n);
      });

      let html = '<option value="ALL">Semua Karyawan</option>';
      Array.from(namesSet).sort().forEach(name => {
        html += `<option value="${name}">${name}</option>`;
      });
      sel.innerHTML = html;
    }

    function loadRekapTip() {
      const selectedMonth = document.getElementById('filterMonth').value;
      const selectedEmp = document.getElementById('filterKaryawan').value;
      const allTips = getTipData();

      let monthTips = allTips.filter(t => {
        const tDate = t.tanggal || t.tgl || '';
        return !selectedMonth || tDate.startsWith(selectedMonth);
      });

      if (monthTips.length === 0) {
        monthTips = allTips;
      }

      if (selectedEmp && selectedEmp !== 'ALL') {
        monthTips = monthTips.filter(t => getEmpName(t).toLowerCase() === selectedEmp.toLowerCase());
      }

      // Calculate totals per employee
      let grandTotalTip = 0;
      const empSumMap = {};

      allTips.forEach(t => {
        const name = getEmpName(t);
        const tip = parseFloat(t.nominalTip || t.tip || 0) || 0;
        grandTotalTip += tip;
        if (name && name !== '-') {
          empSumMap[name] = (empSumMap[name] || 0) + tip;
        }
      });

      // Render Summary Grid
      const grid = document.getElementById('empSummaryGrid');
      let gridHtml = `
        <div class="emp-card highlight">
          <div class="emp-card-label">Total Keseluruhan</div>
          <div class="emp-card-val">${formatRp(grandTotalTip)}</div>
        </div>
      `;

      const sortedEmps = Object.keys(empSumMap).sort((a,b) => empSumMap[b] - empSumMap[a]);
      sortedEmps.forEach(name => {
        gridHtml += `
          <div class="emp-card">
            <div class="emp-card-label">${name}</div>
            <div class="emp-card-val">${formatRp(empSumMap[name])}</div>
          </div>
        `;
      });
      grid.innerHTML = gridHtml;

      // Render Detailed Table and Mobile Cards
      const tbody = document.getElementById('rekapTipTableBody');
      const mobileCards = document.getElementById('tipMobileCards');

      if (monthTips.length === 0) {
        if (tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#94a3b8;">Tidak ada transaksi tip pemotongan kaca.</td></tr>';
        if (mobileCards) mobileCards.innerHTML = '<div style="text-align:center; padding:30px 16px; color:#94a3b8; background:#f8fafc; border-radius:12px; border:1px dashed #cbd5e1;">Tidak ada transaksi tip pemotongan kaca.</div>';
        return;
      }

      if (tbody) {
        tbody.innerHTML = monthTips.map(t => {
          const dateStr = t.tanggal || t.tgl || '-';
          const nameStr = getEmpName(t);
          const jenisStr = t.jenisKaca || t.jenis || 'Kaca Standard';
          const luasNum = parseFloat(t.luasM2 || t.luas || 0) || 0;
          const hargaNum = parseFloat(t.totalOmset || t.totalHarga || t.omset || 0) || 0;
          const tipNum = parseFloat(t.nominalTip || t.tip || 0) || 0;

          return `
            <tr>
              <td style="font-weight:700; color:#475569;">${dateStr}</td>
              <td><strong style="color:#0f172a;">${nameStr}</strong></td>
              <td><span style="font-weight:600; color:#0ea5e9; background:#f0f9ff; padding:3px 8px; border-radius:6px;">${jenisStr}</span></td>
              <td style="font-weight:700;">${luasNum}</td>
              <td style="font-weight:600; color:#334155;">${formatRp(hargaNum)}</td>
              <td><span class="badge-tip">${formatRp(tipNum)}</span></td>
              <td style="text-align:center;">
                <button onclick="deleteTipItem('${t.id}')" class="btn-del" title="Hapus Transaksi">🗑️</button>
              </td>
            </tr>
          `;
        }).join('');
      }

      if (mobileCards) {
        mobileCards.innerHTML = monthTips.map(t => {
          const dateStr = t.tanggal || t.tgl || '-';
          const nameStr = getEmpName(t);
          const jenisStr = t.jenisKaca || t.jenis || 'Kaca Standard';
          const luasNum = parseFloat(t.luasM2 || t.luas || 0) || 0;
          const hargaNum = parseFloat(t.totalOmset || t.totalHarga || t.omset || 0) || 0;
          const tipNum = parseFloat(t.nominalTip || t.tip || 0) || 0;

          return `
            <div style="background:#ffffff; border:1.5px solid #e2e8f0; border-radius:14px; padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,0.03); display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong style="font-size:15px; color:#0f172a;">${nameStr}</strong>
                <span class="badge-tip">${formatRp(tipNum)}</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#64748b;">
                <span>📅 ${dateStr}</span>
                <span style="font-weight:700; color:#0ea5e9; background:#f0f9ff; padding:2px 8px; border-radius:6px;">${jenisStr}</span>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:12.5px; border-top:1px dashed #f1f5f9; padding-top:8px;">
                <div>Luas: <strong>${luasNum} m²</strong> &bull; Total: <strong>${formatRp(hargaNum)}</strong></div>
                <button onclick="deleteTipItem('${t.id}')" class="btn-del" title="Hapus Transaksi" style="padding:4px 8px;">🗑️ Hapus</button>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    function deleteTipItem(id) {
      if (!confirm('Hapus transaksi tip pemotongan kaca ini?')) return;
      let all = getTipData();
      all = all.filter(t => t.id !== id);
      localStorage.setItem('kuk_db_tip_v1', JSON.stringify(all));
      localStorage.setItem('kuk_tip_db_v1', JSON.stringify(all));
      populateKaryawanDropdown();
      loadRekapTip();
    }

    function syncDataCloud(silent = false) {
      if (typeof MasterDB !== 'undefined' && MasterDB.syncFromGoogleSheets) {
        MasterDB.syncFromGoogleSheets().then(res => {
          if (!silent) alert(res.message || '✅ Data berhasil disinkronkan!');
          populateKaryawanDropdown();
          loadRekapTip();
        });
      } else {
        loadRekapTip();
      }
    }

    function exportToExcel() {
      alert("Memproses ekspor rekapan tip kaca ke format Excel...");
    }
  </script>
</body>
</html>
