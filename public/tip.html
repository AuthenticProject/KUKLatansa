<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Form Tip Kaca - KUK La Tansa</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/form_layout.css">
</head>
<body>
  <div class="form-container">
    
    <!-- STATE: FORM -->
    <div id="formPanel" class="state-panel active">
      <div class="form-header">
        <h1>Input Tip Kaca</h1>
        <p>Pendataan Tip Pemotongan Kaca</p>
      </div>

      <form id="publicForm" onsubmit="event.preventDefault(); submitTipForm();">
        <div class="form-group">
          <label>Karyawan (Penerima Tip)</label>
          <select id="empId" required>
            <!-- Populated by FormHelper -->
          </select>
          <div class="error-msg">Silakan pilih karyawan.</div>
        </div>

        <div class="form-group">
          <label>Tanggal</label>
          <input type="date" id="date" required>
          <div class="error-msg">Wajib diisi.</div>
        </div>

        <div class="form-group">
          <label>Nama Customer / Pesanan</label>
          <input type="text" id="customer" placeholder="Misal: Bapak Budi (Nota 123)" required>
          <div class="error-msg">Wajib diisi.</div>
        </div>

        <div class="form-group">
          <label>Nominal Tip (Rp)</label>
          <input type="number" id="amount" placeholder="0" min="0" required>
          <div class="error-msg">Wajib diisi dengan angka.</div>
        </div>

        <button type="submit" class="btn-submit">
          <div class="spinner"></div>
          <span class="btn-text">Simpan Tip</span>
        </button>
      </form>
    </div>

    <!-- STATE: SUCCESS -->
    <div id="successPanel" class="state-panel">
      <div class="state-icon">✅</div>
      <h2 class="state-title">Tip Tersimpan</h2>
      <p class="state-desc">Data tip kaca berhasil ditambahkan ke saldo karyawan.</p>
      <div class="ref-box" id="refNumberDisplay">REF-0000</div>
      <button class="btn-secondary" onclick="FormHelper.resetForm('publicForm')">Input Tip Lain</button>
    </div>

    <!-- STATE: ERROR -->
    <div id="errorPanel" class="state-panel">
      <div class="state-icon">❌</div>
      <h2 class="state-title" style="color:var(--form-danger)">Gagal Menyimpan</h2>
      <p class="state-desc" id="errorMsgDisplay">Terjadi kesalahan saat memproses data.</p>
      <button class="btn-secondary" onclick="FormHelper.resetForm('publicForm')">Coba Lagi</button>
    </div>

  </div>

  <script src="../shared/security.js"></script>
  <script src="../shared/master_db.js"></script>
  <script src="shared/form_helper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FormHelper.populateEmployeeDropdown('empId');
      document.getElementById('date').valueAsDate = new Date();
    });

    function submitTipForm() {
      FormHelper.submitForm('publicForm', 'TIPKACA', () => {
        return {
          employeeId: document.getElementById('empId').value,
          date: document.getElementById('date').value,
          customer: document.getElementById('customer').value,
          amount: parseFloat(document.getElementById('amount').value)
        };
      });
    }
  </script>
</body>
</html>
