<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengajuan Cuti - KUK La Tansa</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/form_layout.css">
</head>
<body>
  <div class="form-container">
    
    <!-- STATE: FORM -->
    <div id="formPanel" class="state-panel active">
      <div class="form-header">
        <h1>Form Pengajuan Cuti</h1>
        <p>Silakan isi data cuti / izin Anda</p>
      </div>

      <form id="publicForm" onsubmit="event.preventDefault(); submitLeaveForm();">
        <div class="form-group">
          <label>Nama Karyawan</label>
          <select id="empId" required>
            <!-- Populated by FormHelper -->
          </select>
          <div class="error-msg">Silakan pilih nama karyawan.</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Tanggal Mulai</label>
            <input type="date" id="startDate" required>
            <div class="error-msg">Wajib diisi.</div>
          </div>
          <div class="form-group">
            <label>Tanggal Selesai</label>
            <input type="date" id="endDate" required>
            <div class="error-msg">Wajib diisi.</div>
          </div>
        </div>

        <div class="form-group">
          <label>Jenis Pengajuan</label>
          <select id="leaveType" required>
            <option value="">-- Pilih Jenis --</option>
            <option value="Cuti Tahunan">Cuti Tahunan</option>
            <option value="Sakit">Sakit (Sertakan Surat Dokter)</option>
            <option value="Izin">Izin Keperluan Khusus</option>
          </select>
          <div class="error-msg">Wajib dipilih.</div>
        </div>

        <div class="form-group">
          <label>Alasan / Keterangan</label>
          <textarea id="reason" placeholder="Jelaskan alasan cuti/izin secara singkat" required></textarea>
          <div class="error-msg">Wajib diisi.</div>
        </div>

        <button type="submit" class="btn-submit">
          <div class="spinner"></div>
          <span class="btn-text">Kirim Pengajuan</span>
        </button>
      </form>
    </div>

    <!-- STATE: SUCCESS -->
    <div id="successPanel" class="state-panel">
      <div class="state-icon">✅</div>
      <h2 class="state-title">Pengajuan Berhasil</h2>
      <p class="state-desc">Data cuti Anda telah terekam di sistem KUK.</p>
      <p style="font-size:13px; color:var(--form-text-muted); margin-bottom:8px; text-transform:uppercase;">Nomor Referensi:</p>
      <div class="ref-box" id="refNumberDisplay">REF-0000</div>
      <button class="btn-secondary" onclick="FormHelper.resetForm('publicForm')">Kirim Pengajuan Lain</button>
    </div>

    <!-- STATE: ERROR -->
    <div id="errorPanel" class="state-panel">
      <div class="state-icon">❌</div>
      <h2 class="state-title" style="color:var(--form-danger)">Pengajuan Gagal</h2>
      <p class="state-desc" id="errorMsgDisplay">Terjadi kesalahan saat memproses data.</p>
      <button class="btn-secondary" onclick="FormHelper.resetForm('publicForm')">Coba Lagi</button>
    </div>

  </div>

  <script src="../shared/master_db.js"></script>
  <script src="shared/form_helper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FormHelper.populateEmployeeDropdown('empId');
    });

    function submitLeaveForm() {
      FormHelper.submitForm('publicForm', 'CUTI', () => {
        return {
          employeeId: document.getElementById('empId').value,
          startDate: document.getElementById('startDate').value,
          endDate: document.getElementById('endDate').value,
          leaveType: document.getElementById('leaveType').value,
          reason: document.getElementById('reason').value
        };
      });
    }
  </script>
</body>
</html>
